name: Deploy Cloudflare staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY-STAGING
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY-STAGING' }}
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_STAGING_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_STAGING_D1_DATABASE_ID }}
      CLOUDFLARE_STAGING_R2_BUCKET: ${{ vars.CLOUDFLARE_STAGING_R2_BUCKET }}
      RITEVENUE_ADMIN_EMAIL: ${{ secrets.RITEVENUE_ADMIN_EMAIL }}
      RITEVENUE_GOOGLE_CLIENT_ID: ${{ vars.RITEVENUE_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - name: Verify Google auth in the built Cloudflare Worker
        run: node tests/auth-worker.mjs
      - name: Prepare staging configuration
        run: pnpm cloudflare:prepare:staging
      - name: Apply staging database migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote --config dist/server/wrangler.staging.json
      - name: Deploy staging Worker
        run: pnpm exec wrangler deploy --config dist/server/wrangler.staging.json
